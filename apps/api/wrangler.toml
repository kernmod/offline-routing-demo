name = "offline-routing-segments"
main = "src/index.ts"
compatibility_date = "2026-05-03"
workers_dev = true

# Local defaults only. Before a live deploy, create a D1 database and replace the
# placeholder ID with Wrangler's generated value; no account identifier is committed.
[vars]
ALLOWED_ORIGINS = "http://localhost:4173,http://127.0.0.1:4173"

# Cloudflare's shared edge counter. `namespace_id` is a public configuration
# namespace, not a credential. `RATE_LIMIT_SALT` is intentionally absent: set
# it with `wrangler secret put RATE_LIMIT_SALT` before any production deploy.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "offline-routing-segments"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
