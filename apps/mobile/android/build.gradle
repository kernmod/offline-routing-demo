// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

gradle.projectsEvaluated {
  allprojects { project ->
    project.tasks.configureEach { task ->
      if (
        task.name.startsWith("buildCMake") ||
        task.name.startsWith("configureCMake") ||
        (task.name.startsWith("merge") && task.name.endsWith("NativeLibs"))
      ) {
        task.doNotTrackState(
          "React Native native dependencies can declare unreadable transient outputs during CMake and merged native library packaging."
        )
      }
    }
  }
}
