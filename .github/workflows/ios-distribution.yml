name: ios-distribution

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "ios-internal"
        type: choice
        options:
          - ios-internal
          - ios-testflight
      submit_to_testflight:
        description: "Submit the latest iOS build to TestFlight after a successful store build"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribute:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ios-distribution
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Validate Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "${EXPO_TOKEN:-}" ]]; then
            echo "Missing EXPO_TOKEN secret." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate selected delivery rail
        env:
          SELECTED_PROFILE: ${{ inputs.profile }}
          SUBMIT_TO_TESTFLIGHT: ${{ inputs.submit_to_testflight }}
        run: |
          if [[ "$SUBMIT_TO_TESTFLIGHT" == "true" && "$SELECTED_PROFILE" != "ios-testflight" ]]; then
            echo "submit_to_testflight requires profile=ios-testflight" >&2
            exit 64
          fi

      - name: Prepare optional App Store Connect API key
        if: inputs.profile == 'ios-testflight'
        env:
          EXPO_ASC_API_KEY_BASE64: ${{ secrets.EXPO_ASC_API_KEY_BASE64 }}
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
        run: |
          if [[ -z "$EXPO_ASC_API_KEY_BASE64" ]]; then
            echo "App Store Connect key already managed remotely by Expo, or no CI override provided."
            exit 0
          fi
          test -n "$EXPO_ASC_KEY_ID"
          test -n "$EXPO_ASC_ISSUER_ID"
          umask 077
          asc_key_path="$RUNNER_TEMP/app-store-connect-key.p8"
          printf '%s' "$EXPO_ASC_API_KEY_BASE64" | base64 --decode > "$asc_key_path"
          {
            echo "EXPO_ASC_API_KEY_PATH=$asc_key_path"
            echo "EXPO_ASC_KEY_ID=$EXPO_ASC_KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$EXPO_ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Verify Expo project access
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: ../../node_modules/.bin/eas whoami

      - name: Build iOS binary with EAS
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: ../../node_modules/.bin/eas build --platform ios --profile "${{ inputs.profile }}" --non-interactive --wait

      - name: Submit the latest build to TestFlight
        if: ${{ inputs.profile == 'ios-testflight' && inputs.submit_to_testflight }}
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: ../../node_modules/.bin/eas submit --platform ios --profile production --latest --non-interactive

      - name: Remove temporary App Store Connect key
        if: always()
        run: |
          node --input-type=module -e 'import { rmSync } from "node:fs"; import { join } from "node:path"; rmSync(join(process.env.RUNNER_TEMP, "app-store-connect-key.p8"), { force: true });'
