name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "tools/deploy/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate deploy configuration
        env:
          VIEWER_ORIGIN: ${{ vars.VIEWER_ORIGIN }}
        run: node tools/deploy/validate-api-config.mjs apps/api/wrangler.toml
      - name: Prepare deployment secret
        env:
          RATE_LIMIT_SALT: ${{ secrets.RATE_LIMIT_SALT }}
        run: |
          umask 077
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const salt = process.env.RATE_LIMIT_SALT;
          if (typeof salt !== "string" || salt.length < 32) {
            throw new Error("RATE_LIMIT_SALT must be a GitHub secret of at least 32 characters");
          }
          const path = process.env.RUNNER_TEMP + "/worker-secrets.json";
          writeFileSync(path, JSON.stringify({ RATE_LIMIT_SALT: salt }), { mode: 0o600 });
          NODE
      - name: Apply remote D1 migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - name: Deploy Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VIEWER_ORIGIN: ${{ vars.VIEWER_ORIGIN }}
        run: pnpm exec wrangler deploy --var "ALLOWED_ORIGINS:$VIEWER_ORIGIN" --secrets-file "$RUNNER_TEMP/worker-secrets.json"
      - name: Remove deployment secret
        if: always()
        run: |
          node --input-type=module -e 'import { rmSync } from "node:fs"; rmSync(process.env.RUNNER_TEMP + "/worker-secrets.json", { force: true });'
