name: ci

on:
  push:
  pull_request:

jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust coverage tool
        run: cargo install cargo-llvm-cov --locked --version 0.9.0
      - name: Install pinned WASM generator
        run: cargo install wasm-bindgen-cli --locked --version 0.2.127
      - name: Reject focused or ignored tests
        run: pnpm test:policy
      - name: Build workspaces
        run: pnpm build && cargo build --workspace
      - name: Verify committed WASM is reproducible
        run: git diff --exit-code -- apps/viewer/src/wasm/pkg
      - name: Run JS and root tests
        run: pnpm test
      - name: Run coverage gate
        run: pnpm test:coverage
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust coverage
        run: cargo llvm-cov --workspace --all-targets --exclude cch-routing-lite-wasm --lcov --output-path coverage/rust.lcov --fail-under-lines 80
      - name: Upload JavaScript LCOV evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: javascript-lcov
          path: coverage/js
          if-no-files-found: error
      - name: Upload Rust LCOV evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-lcov
          path: coverage/rust.lcov
          if-no-files-found: error
      - name: Run public audit
        run: pnpm audit:public
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
