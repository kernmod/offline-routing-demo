name: ci

on:
  push:
  pull_request:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust coverage tool
        run: cargo install cargo-llvm-cov --locked --version 0.9.0
      - name: Reject focused or ignored tests
        run: pnpm test:policy
      - name: Build workspaces
        run: pnpm build && cargo build --workspace
      - name: Run JS and root tests
        run: pnpm test
      - name: Run coverage gate
        run: pnpm test:coverage
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust coverage
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path coverage/rust.lcov --fail-under-lines 80
      - name: Upload JavaScript LCOV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javascript-lcov
          path: coverage/js
          if-no-files-found: error
      - name: Upload Rust LCOV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-lcov
          path: coverage/rust.lcov
          if-no-files-found: error
      - name: Run public audit
        run: pnpm audit:public
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
