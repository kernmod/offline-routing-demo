name: pages

on:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned WASM generator
        run: cargo install wasm-bindgen-cli --locked --version 0.2.127
      - name: Build viewer
        env:
          SEGMENTS_API_URL: ${{ vars.SEGMENTS_API_URL }}
          VITE_API_BASE_URL: ${{ vars.SEGMENTS_API_URL }}
          VITE_VIEWER_BASE: /offline-routing-demo/
        run: |
          node --input-type=module -e '
            const value = process.env.SEGMENTS_API_URL;
            if (!value) throw new Error("SEGMENTS_API_URL repository variable is required");
            const url = new URL(value);
            if (url.protocol !== "https:" || url.username || url.password || url.search || url.hash) {
              throw new Error("SEGMENTS_API_URL must be a public HTTPS origin or base path");
            }
          '
          pnpm --filter @offline-routing/viewer build
      - name: Verify committed WASM is reproducible
        run: git diff --exit-code -- apps/viewer/src/wasm/pkg
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
