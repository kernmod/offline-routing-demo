name: ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Rust / Nitro / iOS Simulator
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: 16.4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.94.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          components: llvm-tools-preview

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the public Nitro bridge and offline assets
        run: |
          pnpm --filter react-native-offline-router exec nitrogen
          pnpm --filter @offline-routing/mobile prepare:assets

      - name: Build the single Rust XCFramework
        run: packages/offline-router/scripts/build-ios-rust-xcframework.sh

      - name: Install iOS pods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build the unsigned Release simulator application
        working-directory: apps/mobile/ios
        env:
          NODE_ENV: production
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/ios-simulator-evidence"
          set -o pipefail
          xcodebuild \
            -workspace mobile.xcworkspace \
            -scheme mobile \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/ios-simulator-evidence/xcodebuild.log"

      - name: Verify xcrun simctl boot, install, and local route execution
        env:
          IOS_SIMULATOR_TIMEOUT_SECONDS: "180"
        run: |
          # The verifier runs xcrun simctl boot, xcrun simctl install, then:
          # xcrun simctl openurl "$UDID" "offlineroutingdemo://route?origin=-33.8688%2C151.2093&destination=-33.8695%2C151.2102"
          # Its evidence contract is routeSource":"local_native" and networkAttempts":0.
          packages/offline-router/scripts/verify-ios-simulator.sh \
            --app "$GITHUB_WORKSPACE/build/ios-derived-data/Build/Products/Release-iphonesimulator/mobile.app" \
            --evidence-dir "$GITHUB_WORKSPACE/artifacts/ios-simulator-evidence"

      - name: Upload simulator application
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-routing-ios-simulator-app
          path: build/ios-derived-data/Build/Products/Release-iphonesimulator/mobile.app
          if-no-files-found: error

      - name: Upload Rust XCFramework
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-routing-ios-rust-xcframework
          path: packages/offline-router/ios/OfflineRouterCore.xcframework
          if-no-files-found: error

      - name: Upload simulator runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-routing-ios-simulator-evidence
          path: artifacts/ios-simulator-evidence
          if-no-files-found: warn
